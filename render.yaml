services:
  - type: web
    name: trade-z-backend
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
